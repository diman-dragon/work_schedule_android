<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <title>График смен</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="nav">
        <button class="icon-btn" id="prevBtn" aria-label="Предыдущий месяц"></button>
        <button class="month-title" id="monthTitle" aria-label="Выбрать месяц">
          <span id="monthName">—</span> <span id="monthYear" class="year"></span>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="Следующий месяц"></button>
      </div>
      <div class="tools">
        <button class="icon-btn" id="menuBtn" aria-label="Меню"></button>
      </div>
    </header>

    <main>
      <section class="summary" aria-live="polite">
        <div class="tile">
          <div class="lbl">Отработано</div>
          <div class="val" id="sumHours">—</div>
        </div>
        <div class="tile accent">
          <div class="lbl">Заработок</div>
          <div class="val"><span id="sumMoney">—</span><span class="unit"> дин.</span></div>
        </div>
        <div class="tile narrow">
          <div class="lbl">Смен</div>
          <div class="val" id="sumShifts">—</div>
        </div>
      </section>

      <div class="subline">
        <button class="chip" id="rateChip" aria-label="Изменить ставку"></button>
        <button class="chip chip-today" id="todayBtn" hidden>Сегодня</button>
      </div>
      <div class="pending-note" id="pendingNote" hidden></div>

      <div class="weekdays" aria-hidden="true">
        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span class="we">Сб</span><span class="we">Вс</span>
      </div>
      <section class="grid" id="grid" aria-label="Календарь смен"></section>

      <div class="legend">
        <span><i class="lg worked"></i>смена</span>
        <span><i class="lg pending"></i>идёт</span>
        <span><i class="lg notstarted"></i>впереди</span>
        <span><i class="lg offmark"></i>выходной</span>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/capacitor.js"></script>
  <script src="js/version.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/model.js"></script>
  <script src="js/native.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/dataio.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

name: Сборка Android APK

# Собирается автоматически при каждом push в main/master и вручную (Actions → Run workflow).
# Готовый APK — в разделе Artifacts запуска, а при теге вида v1.0.0 — ещё и в Releases.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm ci

      - name: Рантайм Capacitor (в версии, совпадающей с пакетом)
        run: cp node_modules/@capacitor/core/dist/capacitor.js www/js/vendor/capacitor.js

      - name: Синхронизация веб-части в Android-проект
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименование APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk shift-schedule.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shift-schedule-apk
          path: shift-schedule.apk

      - name: Публикация в Releases (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: shift-schedule.apk
